<section id="tour-card" class="tour-card" role="dialog" aria-modal="false" aria-labelledby="tour-text" hidden>
<p class="tour-step" aria-live="polite"></p>
<p id="tour-text" class="tour-text"></p>
<div class="tour-actions"><button class="tour-skip" type="button">Skip tour</button><button class="tour-back" type="button">Back</button><button class="tour-next" type="button">Next</button></div>
</section>
<div id="tour-invite" class="tour-invite" hidden>
<div class="tour-invite-panel"><button class="tour-invite-start" type="button">Take the tour</button><button class="tour-invite-skip" type="button">or explore on my own</button></div>
</div>
<button id="tour-replay" class="tour-replay" type="button" hidden>Take the tour</button>
