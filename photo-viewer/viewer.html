<dialog id="photo-window" aria-label="Photo">
  <figure class="photo-print">
    <img id="photo-image" alt="A photo with friends and family">
    <figcaption id="photo-caption" hidden></figcaption>
    <button id="close-photo" class="photo-close" type="button" aria-label="Put the photo back"><span aria-hidden="true">×</span></button>
  </figure>
</dialog>
