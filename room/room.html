<main id="stage" aria-label="Interactive 3D room model. Click or tap objects to explore, drag to look around, and pinch to zoom."></main>
<div id="drawing-labels" aria-label="Measured room dimensions"></div>
<svg id="callout-lines" aria-hidden="true"></svg>
<aside class="title-block" aria-label="Drawing title block"><div class="project"><small>Project</small>Personal Room</div><div class="title-fields"><div><small>Scale</small>1:20</div><div><small>Designed by</small>Nathan Liu</div><div><small>Dorm</small>Carlyle Court</div><div><small>Date</small><time id="drawing-date"></time></div></div></aside>
<div id="destinations" aria-label="Room destinations">
<button class="hotspot" data-destination="desk" hidden>Sit at desk</button>
<button class="hotspot" data-destination="resume" hidden>Read resume</button>
<button class="hotspot" data-destination="laptop" hidden>Turn on laptop</button>
</div>

<div id="dish-tag" aria-hidden="true" hidden></div>

<div class="room-feedback"><p class="hint" role="status" aria-live="polite">Welcome to my room. Make yourself at home.</p><button id="back-to-room" hidden>Back to room <span aria-hidden="true">↗</span></button></div>
