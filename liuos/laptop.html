<dialog id="laptop-window" aria-labelledby="workspace-title">
<div class="os-bezel"><span class="os-brand" id="workspace-title"><span class="os-mark" aria-hidden="true">L</span>LiuOS</span><span class="os-camera" aria-hidden="true"></span><button id="close-laptop" aria-label="Back to desk">Back to desk</button></div>
<section id="lock-screen" class="lock-screen" aria-label="LiuOS lock screen">
<div class="os-lock-curtain" id="lock-curtain"><button id="reveal-signin" aria-label="Continue to sign in"></button><time class="os-clock" id="os-clock"></time><div class="os-date" id="os-date"></div><div class="os-lock-wordmark">LiuOS</div><div class="os-continue"><span aria-hidden="true">↑</span>Click or press any key to continue</div></div>
<div class="os-signin" id="signin-panel" inert><div class="avatar" style="position:relative;overflow:hidden"><img src="assets/photos/portrait.jpg" alt="Nathan Liu" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;border-radius:50%;display:block"></div><h3>Nathan Liu</h3><p class="signin-caption">A little window into my world.</p><button id="guest-signin" class="os-primary">Sign in as Guest</button><button id="puzzle-toggle" class="os-link os-puzzle-toggle" aria-expanded="false" aria-controls="os-puzzle" aria-haspopup="dialog">Know the password?</button>
<p class="os-signin-foot">Guest access · no account required</p></div>
<!-- "Know the password?" popup: centered on the laptop screen over a dimmed lock screen. -->
<div id="os-puzzle" class="os-puzzle-backdrop" hidden><div class="os-puzzle" role="dialog" aria-modal="true" aria-labelledby="puzzle-title"><button id="puzzle-close" class="os-puzzle-close" type="button" aria-label="Close">✕</button><h3 id="puzzle-title">Know the password?</h3><form id="unlock-form"><label for="password-answer">What is my favorite coding language?</label><div class="answer-row"><input id="password-answer" autocomplete="off" spellcheck="false" placeholder="Your guess…" aria-describedby="answer-message"><button type="submit">Unlock</button></div><p id="answer-message" role="status" aria-live="polite"></p></form><div class="os-puzzle-actions"><button id="riddle-hint" class="os-link">Hint</button><button id="skip-puzzle" class="os-link">Skip · enter as guest</button></div></div></div></section>
<section id="desktop" class="os-desktop" hidden aria-label="LiuOS desktop">
<div class="desktop-icons" id="os-icons" aria-label="Desktop apps"></div>
<aside class="os-widget" aria-label="What I'm doing now"><span class="widget-overline">CURRENTLY</span><h3 id="widget-role"></h3><p id="widget-org"></p><small id="widget-education"></small></aside>
<div class="os-window-layer" id="os-windows" aria-label="Open applications"></div>
<div id="start-menu" class="start-menu" hidden><h3>LiuOS · System</h3><button id="lock-laptop">Lock</button><button id="power-off">Shut down</button><button id="wallpaper-toggle">Switch wallpaper</button></div>
<section class="os-search" id="os-search" hidden aria-label="Search apps"><label for="workspace-search">Find an app</label><input id="workspace-search" type="search" placeholder="Search LiuOS…" autocomplete="off"><div id="os-search-results"></div></section>
<nav class="os-dock" aria-label="LiuOS taskbar"><div class="os-tray-left"><div id="os-weather" class="os-weather" aria-label="Weather"></div></div><div class="os-dock-center"><button id="start-button" aria-label="System menu" aria-expanded="false" title="System menu"></button><button id="os-search-button" aria-label="Search apps" aria-expanded="false" title="Search apps"></button><div id="os-pinned" class="os-pinned"></div></div><div class="os-tray-right"><div id="os-battery" class="os-battery" aria-label="Battery"></div><time id="desktop-time" class="os-dock-clock"><span id="desktop-clock-time"></span><span id="desktop-clock-date"></span></time></div></nav>
<span id="os-announcement" class="os-sr-only" role="status" aria-live="polite"></span>
</section></dialog>
